[package]
name = "agent-engine"
version = "0.1.0"
edition = "2021"
description = "Android agent engine inspired by OpenCode, written in Rust"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Regex (for permission wildcard matching)
regex = "1"

# pin-project for streaming
pin-project = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Streaming / Event handling
tokio-stream = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# SQLite for persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Glob pattern matching
glob = "0.3"

# Directory walking (for grep tool)
walkdir = "2"
colored = "2"
atty = "0.2.14"
ratatui = "0.28"
crossterm = "0.27"
textwrap = "0.16.2"
unicode-width = "0.2.2"
git2 = "0.21.0"
